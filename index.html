<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>你容易吸引什么恋人｜12 种引力体质测评</title>
<style>
:root{
  --cream:#FFF8F4;
  --pink:#F7C7D2;
  --pink-soft:#FDE9EE;
  --rose:#D4697F;
  --rose-deep:#B7485F;
  --ink:#5A4150;
  --ink-soft:#8A6B78;
  --line:#F2DEE4;
  --white:#FFFDFC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #FFEFF2 0%, rgba(255,239,242,0) 60%),
    linear-gradient(180deg,#FFF8F4 0%, #FDF2F4 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
.view{display:none;flex:1;flex-direction:column;position:relative;z-index:1}
.view.active{display:flex}

/* 手绘小花装饰 */
.bloom{position:absolute;pointer-events:none;z-index:0;opacity:.9}
.bloom svg{display:block}

/* ---------- 首页 ---------- */
#home{justify-content:center;padding:0 24px;text-align:center}
.home-inner{width:min(100%,520px);margin:0 auto;padding:40px 0 56px;position:relative}
.deco-top{display:flex;justify-content:center;margin-bottom:22px}
.kicker{
  display:inline-block;font-size:12px;letter-spacing:.16em;color:var(--rose);
  margin:0 0 20px;font-weight:600;background:var(--pink-soft);
  padding:6px 14px;border-radius:999px;
}
h1{
  margin:0;font-family:"Songti SC","STSong","SimSun",Georgia,serif;
  font-size:clamp(38px,10.6vw,58px);line-height:1.24;font-weight:700;letter-spacing:.01em;
  color:var(--ink);
}
h1 em{font-style:normal;color:var(--rose);position:relative}
h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:2px;height:8px;
  background:var(--pink-soft);border-radius:6px;z-index:-1;
}
.sub{margin:20px auto 34px;color:var(--ink-soft);font-size:15.5px;max-width:24em}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 34px;border-radius:999px;border:1px solid transparent;
  font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease,color .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:linear-gradient(135deg,#E98AA0 0%, #D4697F 100%);color:#fff;
  box-shadow:0 10px 24px -10px rgba(212,105,127,.75);
}
.btn.primary:hover{box-shadow:0 12px 28px -10px rgba(212,105,127,.85)}
.btn.ghost{background:#fff;color:var(--rose-deep);border-color:var(--pink)}
.hint{margin:18px 0 0;font-size:12.5px;color:var(--ink-soft);opacity:.85}

/* ---------- 答题 ---------- */
#quiz{padding:0 0 40px}
.quiz-top{
  position:sticky;top:0;z-index:5;
  background:rgba(255,248,244,.94);backdrop-filter:blur(8px);
  padding:16px 22px 10px;border-bottom:1px solid var(--line);
}
.bar{height:5px;background:#F6E2E8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F0A6B8,#D4697F);border-radius:99px;transition:width .3s ease}
.meta{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;font-size:13px;color:var(--ink-soft);
}
.link{
  background:none;border:none;padding:8px 2px;font:inherit;color:var(--ink-soft);
  cursor:pointer;min-height:44px;min-width:44px;text-align:right;
}
.link:hover{color:var(--rose)}
.q-wrap{width:min(100%,620px);margin:0 auto;padding:34px 22px 24px}
.q-wrap.enter{animation:slide .3s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q-text{
  font-size:clamp(21px,5.4vw,26px);line-height:1.55;margin:0 0 26px;font-weight:700;
  font-family:"Songti SC","STSong","SimSun",Georgia,serif;letter-spacing:.01em;
}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:block;width:100%;text-align:left;padding:16px 18px;min-height:56px;
  background:var(--white);border:1px solid var(--line);border-radius:16px;
  font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer;line-height:1.5;
  transition:transform .12s ease,border-color .12s ease,background-color .12s ease,box-shadow .12s ease;
}
.opt:hover{border-color:var(--pink);box-shadow:0 6px 16px -12px rgba(212,105,127,.6)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{
  border-color:var(--rose);background:var(--pink-soft);font-weight:600;
  box-shadow:0 0 0 2px rgba(212,105,127,.16) inset;
}
.opt[aria-pressed="true"]::after{content:"♥";float:right;color:var(--rose);font-size:15px;line-height:1.5}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* ---------- 揭晓页（仪式感） ---------- */
#finish{justify-content:center;text-align:center;padding:0 24px}
.finish-inner{width:min(100%,480px);margin:0 auto;padding:40px 0 56px}
.seal{display:flex;justify-content:center;margin-bottom:26px}
.seal svg{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.finish-inner h2{
  margin:0 0 10px;font-family:"Songti SC","STSong","SimSun",Georgia,serif;
  font-size:clamp(30px,8.6vw,42px);line-height:1.3;font-weight:700;color:var(--ink);
}
.finish-inner .kicker{margin-bottom:20px}
.finish-inner .sub{margin:14px auto 34px}
.btn.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 10px 24px -10px rgba(212,105,127,.75),0 0 0 0 rgba(212,105,127,.28)}
  50%{box-shadow:0 10px 24px -10px rgba(212,105,127,.75),0 0 0 12px rgba(212,105,127,0)}
}

/* ---------- 结果 ---------- */
#result{padding:26px 18px calc(40px + env(safe-area-inset-bottom))}
.r-wrap{width:min(100%,440px);margin:0 auto;display:flex;flex-direction:column;gap:16px}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:22px;
  padding:28px 24px;box-shadow:0 18px 40px -32px rgba(90,65,80,.35);
}
.hero{text-align:center;padding-bottom:22px}
.hero .kicker{margin-bottom:14px}
.r-name{
  margin:4px 0 6px;font-family:"Songti SC","STSong","SimSun",Georgia,serif;
  font-size:clamp(32px,9vw,40px);font-weight:700;color:var(--rose-deep);letter-spacing:.02em;
}
.r-tag{margin:0;color:var(--ink-soft);font-size:15px}
.shadow{margin:10px 0 0;font-size:12.5px;color:var(--rose);opacity:.85}

/* 六边形雷达 */
.radar-card{padding:18px 12px 6px}
.radar-title{display:flex;align-items:baseline;justify-content:space-between;padding:0 10px;margin-bottom:2px}
.radar-title span{font-size:12px;letter-spacing:.14em;color:var(--ink-soft)}
.radar-box{display:flex;justify-content:center}
.radar-box svg{width:100%;max-width:340px;height:auto;display:block}

/* 文案分段 */
.story{padding:6px 24px 10px}
.story-item{padding:18px 0;border-top:1px dashed var(--line)}
.story-item:first-child{border-top:0;padding-top:8px}
.story h3{
  margin:0 0 8px;font-size:12.5px;letter-spacing:.14em;color:var(--rose);font-weight:600;
}
.story p{margin:0;font-size:15.5px;line-height:1.85;color:#6B5360}

/* 分享卡 */
.share-card{padding:22px 24px}
.share-label{font-size:12px;letter-spacing:.14em;color:var(--ink-soft);margin:0 0 10px}
.share-text{
  margin:0 0 16px;padding:14px 16px;border:1px dashed #EBC4CE;border-radius:14px;
  background:#FFF4F6;font-size:15px;line-height:1.75;color:var(--ink);
}
.share-card .btn{width:100%}

.watermark{margin:6px 0 0;text-align:center;font-size:11px;letter-spacing:.16em;color:#C9AEB8}
.disclaimer{text-align:center;font-size:12px;color:var(--ink-soft);margin:6px 0 0;opacity:.8}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

</main>

<script>
(function () {
  'use strict';

  var DIMS = ['H', 'C', 'I', 'E'];
  var STORE = 'love-attract-quiz-v1';
  var TOTAL = QUESTIONS.length;

  var state = { answers: new Array(TOTAL).fill(-1), idx: 0 };

  var $ = function (id) { return document.getElementById(id); };
  var views = { home: $('home'), quiz: $('quiz'), finish: $('finish'), result: $('result') };

  function show(name) {
    Object.keys(views).forEach(function (k) {
      views[k].classList.toggle('active', k === name);
    });
    window.scrollTo(0, 0);
  }

  /* ---------- 进度存取 ---------- */
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var obj = JSON.parse(raw);
      if (obj && Array.isArray(obj.answers) && obj.answers.length === TOTAL) {
        state.answers = obj.answers;
        state.idx = Math.max(0, Math.min(TOTAL - 1, obj.idx | 0));
      }
    } catch (e) {}
  }
  function reset() {
    state.answers = new Array(TOTAL).fill(-1);
    state.idx = 0;
    try { localStorage.removeItem(STORE); } catch (e) {}
  }

  /* ---------- 题目与选项 ----------
     数据里每题 4 个选项按 H/C/I/E 顺序写。
     显示顺序随题号轮转（offset = i % 4），避免「总点第一个」把结果带偏。
     选中项：主维 +3；次维（稳定 S / 好奇 Q）按题号轮转 +1。 */
  var qWrap = $('qWrap'), qText = $('qText'), opts = $('opts'),
      qCount = $('qCount'), barFill = $('barFill');

  function subDim(i, d) {
    // 数据下标 0/1 → 稳定 S，2/3 → 好奇 Q；每题固定 2 个 S、2 个 Q
    return (d < 2) ? 'S' : 'Q';
  }

  function renderQuestion(animate) {
    var i = state.idx;
    var q = QUESTIONS[i];
    var answered = state.answers.filter(function (v) { return v > -1; }).length;

    qText.textContent = q[0];
    qCount.textContent = '第 ' + (i + 1) + ' / ' + TOTAL + ' 题';
    barFill.style.width = (answered / TOTAL * 100) + '%';

    opts.innerHTML = '';
    var off = i % 4;
    for (var k = 0; k < 4; k++) {
      (function (k) {
        var d = (k + off) % 4; // 显示位置 k 对应的数据下标
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt';
        b.textContent = q[d + 1];
        b.setAttribute('aria-pressed', state.answers[i] === d ? 'true' : 'false');
        b.addEventListener('click', function () { pick(i, k); });
        opts.appendChild(b);
      })(k);
    }

    if (animate) {
      qWrap.classList.remove('enter');
      void qWrap.offsetWidth;
      qWrap.classList.add('enter');
    }
  }

  function pick(i, k) {
    var off = i % 4;
    var d = (k + off) % 4; // 存进答案的是数据下标
    state.answers[i] = d;
    save();

    var cur = opts.children[k];
    if (cur) { cur.setAttribute('aria-pressed', 'true'); }

    var answered = state.answers.filter(function (v) { return v > -1; }).length;
    barFill.style.width = (answered / TOTAL * 100) + '%';

    if (i < TOTAL - 1) {
      setTimeout(function () {
        state.idx = i + 1;
        save();
        renderQuestion(true);
      }, 300);
    } else {
      setTimeout(showFinish, 320);
    }
  }

  /* ---------- 六维指数 ---------- */
  var AXES = [
    { key: 'H', label: '热度', max: 30 },
    { key: 'C', label: '亲密', max: 30 },
    { key: 'I', label: '独立', max: 30 },
    { key: 'E', label: '表达', max: 30 },
    { key: 'S', label: '稳定', max: 40 },
    { key: 'Q', label: '好奇', max: 40 }
  ];

  function scoreAll() {
    var s = { H: 0, C: 0, I: 0, E: 0, S: 0, Q: 0 };
    for (var i = 0; i < TOTAL; i++) {
      var d = state.answers[i];
      if (d < 0) d = 0;
      s[DIMS[d]] += 3;
      s[subDim(i, d)] += 1;
    }
    return s;
  }

  function radarSVG(values) {
    var S = 340, cx = S / 2, cy = S / 2 + 4, R = 106;
    var n = 6;
    function pt(idx, ratio) {
      var a = -Math.PI / 2 + idx * Math.PI / 3;
      return [cx + Math.cos(a) * R * ratio, cy + Math.sin(a) * R * ratio];
    }
    var out = '<svg viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="六维引力指数图">';

    // 网格
    [0.25, 0.5, 0.75, 1].forEach(function (r) {
      var pts = [];
      for (var i = 0; i < n; i++) { var p = pt(i, r); pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
      out += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#F3DCE3" stroke-width="' + (r === 1 ? 1.6 : 1) + '"/>';
    });
    // 轴线
    for (var i = 0; i < n; i++) {
      var p = pt(i, 1);
      out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#F7E7EC" stroke-width="1"/>';
    }
    // 数据多边形与顶点先放空壳，由 drawRadar() 在动画里逐步填满
    out += '<polygon id="radarData" points="" fill="rgba(212,105,127,0.22)" stroke="#D4697F" stroke-width="2" stroke-linejoin="round"/>';
    out += '<g id="radarDots"></g>';
    // 轴标签 + 数值
    for (var t = 0; t < n; t++) {
      var lp = pt(t, 1.24);
      var anchor = 'middle';
      if (lp[0] > cx + 8) anchor = 'start';
      else if (lp[0] < cx - 8) anchor = 'end';
      out += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] - 2).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="12" fill="#8A6B78">' + AXES[t].label + '</text>';
      out += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 13).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="11.5" font-weight="700" fill="#B7485F" data-num="' + t + '">0</text>';
    }
    out += '</svg>';
    return out;
  }

  /* ---------- 雷达图展开动画 ---------- */
  var RG = { cx: 170, cy: 174, R: 106 };

  function radarPoint(idx, ratio) {
    var a = -Math.PI / 2 + idx * Math.PI / 3;
    return [RG.cx + Math.cos(a) * RG.R * ratio, RG.cy + Math.sin(a) * RG.R * ratio];
  }

  function drawRadar(values, ratio) {
    var poly = document.getElementById('radarData');
    var dots = document.getElementById('radarDots');
    if (!poly || !dots) return;

    var pts = [];
    for (var i = 0; i < 6; i++) {
      var r = Math.max(0.015, Math.min(1, values[i] / 100)) * ratio;
      var p = radarPoint(i, r);
      pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
    }
    poly.setAttribute('points', pts.join(' '));

    var dh = '';
    for (var j = 0; j < 6; j++) {
      var r2 = Math.max(0.015, Math.min(1, values[j] / 100)) * ratio;
      var v = radarPoint(j, r2);
      dh += '<circle cx="' + v[0].toFixed(1) + '" cy="' + v[1].toFixed(1) +
        '" r="' + (3.6 * Math.min(1, ratio * 1.4)).toFixed(2) + '" fill="#D4697F"/>';
    }
    dots.innerHTML = dh;

    for (var k = 0; k < 6; k++) {
      var el = document.querySelector('[data-num="' + k + '"]');
      if (el) el.textContent = Math.round(values[k] * ratio);
    }
  }

  function animateRadar(values) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { drawRadar(values, 1); return; }
    var start = performance.now(), dur = 950;
    function step(now) {
      var t = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      drawRadar(values, e);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 匹配 ---------- */
  var TYPE_MAP = {
    HC: 'huoguo',      HI: 'yuexiang', HE: 'yanhuo',
    CH: 'hupo',        CI: 'dengta',   CE: 'huiyin',
    IH: 'yefeng',      IC: 'maoxi',    IE: 'yanxi',
    EH: 'bingqishui',  EC: 'shenyediantai', EI: 'jiushudian'
  };

  function byId(id) {
    for (var i = 0; i < RESULTS.length; i++) {
      if (RESULTS[i].id === id) return RESULTS[i];
    }
    return null;
  }

  var pending = null;

  function compute() {
    var s = scoreAll();

    var order = DIMS.map(function (d) { return { d: d, v: s[d] }; });
    order.sort(function (a, b) {
      return (b.v - a.v) || (DIMS.indexOf(a.d) - DIMS.indexOf(b.d));
    });

    var best = byId(TYPE_MAP[order[0].d + order[1].d]);
    var shadow = null;
    if (s[order[2].d] >= s[order[1].d] - 2) {
      shadow = byId(TYPE_MAP[order[0].d + order[2].d]);
    }

    var values = AXES.map(function (ax) {
      return Math.max(0, Math.min(100, s[ax.key] / ax.max * 100));
    });
    return { best: best, shadow: shadow, values: values };
  }

  /* 答完题先停在揭晓页，点了按钮才出结果（仪式感） */
  function showFinish() {
    pending = compute();
    show('finish');
  }

  /* ---------- 结果渲染 ---------- */
  function showResult(r, shadow, values) {
    $('rName').textContent = r.name;
    $('rTag').textContent = r.tag;
    $('rWhy').textContent = r.why;
    $('rWho').textContent = r.who;
    $('rHidden').textContent = r.hidden;
    $('rShare').textContent = r.share;

    var shadowEl = $('rShadow');
    if (shadow) {
      shadowEl.textContent = '你身上还有一点「' + shadow.name.replace('引力', '') + '引力」的影子，只是没它那么明显。';
      shadowEl.hidden = false;
    } else {
      shadowEl.hidden = true;
    }

    if (values && values.length === 6) {
      $('radar').innerHTML = radarSVG(values);
      drawRadar(values, 0);
      animateRadar(values);
    }
    show('result');
  }

  /* ---------- 复制 ---------- */
  function copyShare() {
    var text = $('rShare').textContent;
    var btn = $('copyBtn');
    var done = function () {
      btn.textContent = '已复制，去发吧 ♡';
      setTimeout(function () { btn.textContent = '复制分享句'; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  /* ---------- 事件绑定 ---------- */
  $('startBtn').addEventListener('click', function () {
    reset();
    show('quiz');
    state.idx = 0;
    renderQuestion(true);
  });

  $('backBtn').addEventListener('click', function () {
    if (state.idx > 0) {
      state.idx -= 1;
      save();
      renderQuestion(true);
    }
  });

  $('copyBtn').addEventListener('click', copyShare);

  /* 揭晓按钮：点了才出结果 */
  if ($('revealBtn')) {
    $('revealBtn').addEventListener('click', function () {
      if (!pending) pending = compute();
      var btn = $('revealBtn');
      btn.textContent = '正在揭晓…';
      setTimeout(function () {
        showResult(pending.best, pending.shadow, pending.values);
      }, 280);
    });
  }

  $('againBtn').addEventListener('click', function () {
    reset();
    var rb = $('revealBtn');
    if (rb) rb.textContent = '点击查看你吸引的恋人';
    show('home');
  });

  /* ---------- 启动 ---------- */
  // 调试参数：?demo=huoguo 直接展示某个结果（验收用，普通用户不会碰到）
  var demo = new URLSearchParams(location.search).get('demo');
  if (demo) {
    var hit = RESULTS.filter(function (r) { return r.id === demo; })[0];
    if (hit) {
      showResult(hit, null, [82, 64, 38, 58, 46, 72]);
      return;
    }
  }

  load();
  var answered = state.answers.filter(function (v) { return v > -1; }).length;
  if (answered > 0 && answered < TOTAL) {
    show('quiz');
    renderQuestion(false);
  } else if (answered === TOTAL) {
    pending = compute();
    showResult(pending.best, pending.shadow, pending.values);
  } else {
    show('home');
  }
})();
</script>
</body>
</html>
